<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("<h2> OPERATORS <br>")
        a = 12
        b = 23

        document.write("<h3>1.This is the arithmatic operator <br><h3>")

        document.write("addition is " + (a + b) + "<br>")
        document.write("subtract is " + (a - b) + "<br>")
        document.write("multipliction is" + (a * b) + "<br>")
        document.write("divison is" + (a / b) + "<br>")
        document.write("module is" + (a % b) + "<br>")

        c = 23
        d = 56
        document.write("<h3>2. This is the relational operator<br><h3>")
        document.write("1." + (c == d) + "<br>")
        document.write("2." + (c > d) + "<br>")
        document.write("3." + (c < d) + "<br>")
        document.write("4." + (c >= d) + "<br>")
        document.write("5." + (c <= d) + "<br>")
        document.write("6." + (c != d) + "<br>")

        document.write("<h3>3. This is the logical operator<br><h3>")

        document.write("1." + (c < d && d < c) + "<br>")
        document.write("2." + (c > d || d > c) + "<br>")
        document.write("3." + !((c < d || d < c)) + "<br>")

        
       
            
        

       
        






















    </script>
    
</body>
</html>
