<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function reverse(n)
        {
            n=n+"";
            return n.split("").reverse().join("");

        }
        document.write(Number(reverse(123456)));
        document.write("<br>")


        
        function alpha_order(str)
        {
            return str.split('').sort().join('')
        }
        document.write(alpha_order("sakshii"));
        document.write("<br>")
        
        function sakshii()
        {
            document.write(arguments.callee.name);
        }
        sakshii();
        
        














    </script>
    
</body>
</html>
